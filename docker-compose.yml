services:
  db:
    image: postgres:16
    container_name: projekt_db
    environment:
      POSTGRES_USER: projektuser
      POSTGRES_PASSWORD: projektpass
      POSTGRES_DB: projektdb
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projektuser -d projektdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: projekt_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: projektdb
      DB_USER: projektuser
      DB_PASSWORD: projektpass
    volumes:
      - ./data_generation:/app
    stdin_open: true
    tty: true

volumes:
  db_data: